<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Эйнар — Глава 1</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="missions.js"></script>
<style>
  body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<script>
// --- ВСТАВЬ СЮДА КОД ИЗ sprites.js (ПАЛИТРА И МАТРИЦЫ) ---
const PALETTE = {
  '0': null, 'e': '#d4a373', 'd': '#8b5a2b', 'b': '#4a3b2b', 'w': '#ffffff',
  'r': '#d94a4a', 'g': '#888888', 'p': '#9b59b6', 'k': '#111111'
};
function createPixelTexture(scene, key, matrix, pixelSize = 4) {
  const w = matrix[0].length * pixelSize; const h = matrix.length * pixelSize;
  const canvas = scene.textures.createCanvas(key, w, h); const ctx = canvas.getContext();
  for (let r = 0; r < matrix.length; r++) {
    for (let c = 0; c < matrix[r].length; c++) {
      const color = PALETTE[matrix[r][c]];
      if (color) { ctx.fillStyle = color; ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize); }
    }
  }
  canvas.refresh();
}
const MATRIX_EINAR = [['0','0','0','d','d','0','0','0'],['0','0','d','d','d','d','0','0'],['0','0','e','e','e','e','0','0'],['0','0','e','k','e','k','0','0'],['0','0','0','e','e','0','0','0'],['0','0','d','d','d','d','0','0'],['0','d','d','d','d','d','d','0'],['0','d','e','d','d','e','d','0'],['0','0','d','d','d','d','0','0'],['0','0','b','d','d','b','0','0'],['0','0','b','0','0','b','0','0'],['0','0','b','0','0','b','0','0']];
const MATRIX_SOLDIER = [['0','0','0','g','g','0','0','0'],['0','0','g','g','g','g','0','0'],['0','0','e','e','e','e','0','0'],['0','0','e','k','e','k','0','0'],['0','0','0','e','e','0','0','0'],['0','0','r','r','r','r','0','0'],['0','r','r','r','r','r','r','0'],['0','r','e','r','r','e','r','0'],['0','0','b','r','r','b','0','0'],['0','0','b','b','b','b','0','0'],['0','0','b','0','0','b','0','0'],['0','0','b','0','0','b','0','0']];
const MATRIX_INFORMANT = [['0','0','0','p','p','0','0','0'],['0','0','p','p','p','p','0','0'],['0','0','e','e','e','e','0','0'],['0','0','e','k','e','k','0','0'],['0','0','0','e','e','0','0','0'],['0','0','p','p','p','p','0','0'],['0','p','p','p','p','p','p','0'],['0','p','e','p','p','e','p','0'],['0','0','p','p','p','p','0','0'],['0','0','b','p','p','b','0','0'],['0','0','b','0','0','b','0','0'],['0','0','b','0','0','b','0','0']];
// -----------------------------------------------------

const DIALOGS = { citizen: ["Горожанин: Оккупанты забрали хлеб..."], informant: ["Информатор: Патроны? R."], soldier: ["Солдат: Стоять!"], anfisa: ["Анфиса: Эйнар!"] };

class WorldScene extends Phaser.Scene {
  constructor() { super('World'); }

  preload() {
    // Генерируем текстуры ДО старта игры
    createPixelTexture(this, 'einar', MATRIX_EINAR, 4);
    createPixelTexture(this, 'soldier', MATRIX_SOLDIER, 4);
    createPixelTexture(this, 'informant', MATRIX_INFORMANT, 4);
  }

  create() {
    this.worldW = 2000; this.worldH = 1500;
    this.physics.world.setBounds(0, 0, this.worldW, this.worldH);

    // ... (тут весь код карты и домов без изменений) ...
    this.add.rectangle(0,0,this.worldW,this.worldH,0x4a6b4a).setOrigin(0);
    this.obstacles = this.physics.add.staticGroup();
    [[200,200,180,140],[500,180,160,160],[1200,200,200,140],[300,900,200,160],[700,950,180,140],[1300,900,220,160],[1500,300,180,180],[1500,1100,200,160]].forEach(([x,y,w,h]) => {
      this.add.rectangle(x+w/2,y+h/2,w,h,0x8b5a2b).setStrokeStyle(3,0x5a3a1a);
      const o = this.add.rectangle(x+w/2,y+h/2,w,h); this.physics.add.existing(o, true); this.obstacles.add(o);
    });

    // Игрок (Спрайт)
    this.player = this.physics.add.sprite(980, 680, 'einar');
    this.player.body.setSize(20, 20).setOffset(6, 28); // Хитбокс только для ног
    this.player.body.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.obstacles);

    // Вращение спрайта при ходьбе
    this.player.angle = 0; 

    // NPC
    this.npcs = this.physics.add.group(); this.soldiers = this.physics.add.group();
    this.spawnNPC(700, 680, 'citizen', 'Горожанин', MATRIX_SOLDIER); // Используем солдата как горожанина для теста
    this.spawnNPC(1200, 680, 'informant', 'Информатор', MATRIX_INFORMANT);
    this.spawnSoldier(500, 400);
    
    // ... (ОСТАЛЬНОЙ КОД UI, ДИАЛОГОВ, СТРЕЛЬБЫ И МИССИЙ БЕЗ ИЗМЕНЕНИЙ) ...
    // (Я пропустил его тут, чтобы не спамить, но ты просто оставляешь его как было)
  }

  spawnNPC(x, y, type, name, texture) {
    const npc = this.physics.add.sprite(x, y, texture || 'informant');
    npc.body.setSize(20, 20).setOffset(6, 28);
    npc.body.setImmovable(true);
    npc.npcType = type;
    this.npcs.add(npc);
    this.add.text(x, y-30, name, { font:'12px monospace', color:'#fff' }).setOrigin(0.5);
    return npc;
  }

  spawnSoldier(x, y) {
    const s = this.physics.add.sprite(x, y, 'soldier');
    s.body.setSize(20, 20).setOffset(6, 28);
    s.body.setCollideWorldBounds(true);
    s.soldierHp = 30; s.npcType = 'soldier';
    this.soldiers.add(s); this.npcs.add(s);
    s.label = this.add.text(x, y-30, 'Солдат', { font:'12px monospace', color:'#ff9999' }).setOrigin(0.5);
    s.hpBar = this.add.rectangle(x, y-42, 26, 4, 0xff0000).setOrigin(0.5);
    return s;
  }

  // В методе update() не забудь обновлять позиции лейблов (s.label.x = s.x и т.д.)
}
</script>
</body>
</html>
