<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Эйнар — Глава 1</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="missions.js"></script>
<style>
  body { margin:0; background:#111; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<script>
const DIALOGS = {
  citizen: ["Горожанин: Оккупанты забрали последний хлеб...", "Горожанин: Говорят, у телеграфа есть связной."],
  informant: ["Информатор: Валахия усилила патрули.", "Информатор: Патроны? Нажми R рядом со мной.", "Информатор: Приведи мне пленника — заплачу."],
  soldier: ["Солдат Валахии: Проходи мимо!", "Солдат Валахии: Стоять!"],
  anfisa: ["Анфиса: Эйнар, ты цел?", "Анфиса: Начни с патруля у вокзала.", "Анфиса: Свобода близко!"]
};

class WorldScene extends Phaser.Scene {
  constructor() { super('World'); }

  create() {
    this.worldW = 2000; this.worldH = 1500;
    this.physics.world.setBounds(0, 0, this.worldW, this.worldH);

    // Загрузка прогресса
    this.missionId = parseInt(localStorage.getItem('mazetail_mission') || 0);
    this.money = parseInt(localStorage.getItem('mazetail_money') || 50);
    this.hp = 100; this.maxHp = 100; this.ammo = 6;
    
    // Карта
    this.add.rectangle(0,0,this.worldW,this.worldH,0x4a6b4a).setOrigin(0);
    const roads = this.add.graphics();
    roads.fillStyle(0x6b6b6b);
    roads.fillRect(0, 600, this.worldW, 160);
    roads.fillRect(900, 0, 160, this.worldH);

    this.obstacles = this.physics.add.staticGroup();
    [[200,200,180,140],[500,180,160,160],[1200,200,200,140],[300,900,200,160],[700,950,180,140],[1300,900,220,160],[1500,300,180,180],[1500,1100,200,160]].forEach(([x,y,w,h]) => {
      this.add.rectangle(x+w/2,y+h/2,w,h,0x8b5a2b).setStrokeStyle(3,0x5a3a1a);
      const o = this.add.rectangle(x+w/2,y+h/2,w,h);
      this.physics.add.existing(o, true);
      this.obstacles.add(o);
    });

    // Игрок
    this.player = this.add.rectangle(980, 680, 26, 26, 0xd4a373);
    this.physics.add.existing(this.player);
    this.player.body.setCollideWorldBounds(true);
    this.physics.add.collider(this.player, this.obstacles);

    // NPC
    this.npcs = this.physics.add.group();
    this.soldiers = this.physics.add.group();
    this.spawnNPC(700, 680, 0x4a90d9, 'citizen', 'Горожанин');
    this.spawnNPC(1200, 680, 0x9b59b6, 'informant', 'Информатор');
    this.spawnNPC(1400, 1000, 0xe91e63, 'anfisa', 'Анфиса');
    this.spawnSoldier(500, 400);
    this.spawnSoldier(1600, 500);

    // UI
    this.uiText = this.add.text(10, 10, '', { font:'16px monospace', color:'#fff' }).setScrollFactor(0).setDepth(100);
    this.missionText = this.add.text(10, 60, '', { font:'18px monospace', color:'#ffd166', wordWrap:{width:500} }).setScrollFactor(0).setDepth(100);
    this.hintText = this.add.text(10, 35, 'ЛКМ — стрелять/оглушить | R — купить патроны | E — говорить', { font:'12px monospace', color:'#aaa' }).setScrollFactor(0).setDepth(100);
    
    this.dialogBox = this.add.rectangle(480, 440, 900, 120, 0x000000, 0.85).setScrollFactor(0).setDepth(200).setVisible(false);
    this.dialogText = this.add.text(60, 400, '', { font:'16px monospace', color:'#fff', wordWrap:{width:840} }).setScrollFactor(0).setDepth(201).setVisible(false);
    this.dialogIndex = 0; this.dialogLines = []; this.inDialog = false;

    // Камера и управление
    this.cameras.main.setBounds(0,0,this.worldW,this.worldH);
    this.cameras.main.startFollow(this.player);
    this.cursors = this.input.keyboard.createCursorKeys();
    this.wasd = this.input.keyboard.addKeys('W,A,S,D');
    this.input.keyboard.addKey('E').on('down', () => this.interact());
    this.input.keyboard.addKey('R').on('down', () => this.buyAmmo());
    this.input.on('pointerdown', (pointer) => this.shoot(pointer));

    // Пули
    this.bullets = this.physics.add.group();
    this.enemyBullets = this.physics.add.group();
    this.physics.add.overlap(this.bullets, this.soldiers, (b, s) => this.hitSoldier(b, s));
    this.physics.add.overlap(this.bullets, this.obstacles, (b) => b.destroy());
    this.physics.add.overlap(this.enemyBullets, this.player, (b) => { b.destroy(); this.damagePlayer(15); });

    this.updateUI();
    this.updateMission();
  }

  updateUI() {
    this.uiText.setText(`HP: ${this.hp} | $: ${this.money} | Патроны: ${this.ammo}`);
    localStorage.setItem('mazetail_money', this.money);
  }

  updateMission() {
    const m = MISSIONS[this.missionId];
    if (!m) return;
    this.missionText.setText(`ЗАДАНИЕ: ${m.title}\n${m.desc}`);
    if (m.type === 'end') {
      this.missionText.setColor('#00ff00');
      this.missionText.setText(`ГЛАВА 1 ПРОЙДЕНА!\nВы освободили город.`);
    }
  }

  advanceMission() {
    this.missionId++;
    localStorage.setItem('mazetail_mission', this.missionId);
    this.updateMission();
  }

  spawnNPC(x, y, color, type, name) {
    const npc = this.add.rectangle(x, y, 24, 24, color);
    this.physics.add.existing(npc);
    npc.body.setImmovable(true);
    npc.npcType = type; npc.npcName = name;
    this.npcs.add(npc);
    this.add.text(x, y-22, name, { font:'12px monospace', color:'#fff' }).setOrigin(0.5);
    return npc;
  }

  spawnSoldier(x, y) {
    const s = this.add.rectangle(x, y, 26, 26, 0xd94a4a);
    this.physics.add.existing(s);
    s.body.setCollideWorldBounds(true);
    s.soldierHp = 30; s.npcType = 'soldier';
    this.soldiers.add(s);
    this.npcs.add(s);
    s.label = this.add.text(x, y-24, 'Солдат', { font:'12px monospace', color:'#ff9999' }).setOrigin(0.5);
    s.hpBar = this.add.rectangle(x, y-36, 26, 4, 0xff0000).setOrigin(0.5);
    return s;
  }

  shoot(pointer) {
    if (this.inDialog || this.ammo <= 0) return;
    this.ammo--; this.updateUI();

    // Координаты курсора с учётом камеры
    const worldPoint = pointer.positionToCamera(this.cameras.main);
    let dx = worldPoint.x - this.player.x, dy = worldPoint.y - this.player.y;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;

    // Если рядом горожанин и миссия "захват" — оглушаем
    const nearCitizen = this.npcs.getChildren().find(n => n.npcType === 'citizen' && Phaser.Math.Distance.Between(this.player.x, this.player.y, n.x, n.y) < 60);
    if (nearCitizen && MISSIONS[this.missionId].type === 'capture') {
      nearCitizen.fillColor = 0xffff00;
      nearCitizen.npcType = 'captured';
      nearCitizen.labelText = this.add.text(nearCitizen.x, nearCitizen.y-22, 'Пленник', { font:'12px monospace', color:'#ffff00' }).setOrigin(0.5);
      this.hintText.setText("Пленник захвачен! Веди его к Информатору (стреляй, если он отстаёт).");
      return;
    }

    const bullet = this.add.rectangle(this.player.x, this.player.y, 8, 8, 0xffff00);
    this.physics.add.existing(bullet);
    bullet.body.setVelocity(dx * 800, dy * 800);
    this.bullets.add(bullet);
    this.time.delayedCall(800, () => { if (bullet.active) bullet.destroy(); });
  }

  hitSoldier(bullet, soldier) {
    if (!bullet.active) return;
    bullet.destroy();
    soldier.soldierHp -= 10;
    soldier.hpBar.width = 26 * Math.max(0, soldier.soldierHp / 30);
    if (soldier.soldierHp <= 0) {
      soldier.label.destroy(); soldier.hpBar.destroy(); soldier.destroy();
      this.money += 25; this.updateUI();
      if (MISSIONS[this.missionId].type === 'kill') {
        MISSIONS[this.missionId].count--;
        if (MISSIONS[this.missionId].count <= 0) this.advanceMission();
        else this.updateMission();
      }
    }
  }

  interact() {
    if (this.inDialog) { this.nextDialogLine(); return; }
    const near = this.npcs.getChildren().find(n => Phaser.Math.Distance.Between(this.player.x, this.player.y, n.x, n.y) < 80);
    if (!near) return;

    // Логика миссий при разговоре
    const m = MISSIONS[this.missionId];
    if (m && m.type === 'talk' && near.npcType === m.target) this.advanceMission();
    if (near.npcType === 'informant' && m && m.type === 'capture' && this.npcs.getChildren().some(n=>n.npcType==='captured')) {
      const captured = this.npcs.getChildren().find(n=>n.npcType==='captured');
      captured.destroy(); captured.labelText.destroy();
      this.money += 100; this.updateUI();
      this.advanceMission();
      this.hintText.setText("Пленник сдан! Получено $100.");
    }

    this.startDialog(DIALOGS[near.npcType] || ["..."]);
  }

  startDialog(lines) {
    this.dialogLines = lines; this.dialogIndex = 0; this.inDialog = true;
    this.dialogBox.setVisible(true); this.dialogText.setVisible(true);
    this.dialogText.setText(lines[0]);
  }

  nextDialogLine() {
    this.dialogIndex++;
    if (this.dialogIndex >= this.dialogLines.length) {
      this.dialogBox.setVisible(false); this.dialogText.setVisible(false); this.inDialog = false;
    } else { this.dialogText.setText(this.dialogLines[this.dialogIndex]); }
  }

  buyAmmo() {
    const inf = this.npcs.getChildren().find(n => n.npcType === 'informant');
    if (inf && Phaser.Math.Distance.Between(this.player.x, this.player.y, inf.x, inf.y) < 90) {
      if (this.money >= 15) {
        this.money -= 15; this.ammo += 10; this.updateUI();
        if (MISSIONS[this.missionId].type === 'buy_ammo') this.advanceMission();
      }
    }
  }

  update(time) {
    // ИИ солдат и обновление интерфейса
    this.soldiers.getChildren().forEach(s => {
      s.label.x = s.x; s.label.y = s.y - 24;
      s.hpBar.x = s.x; s.hpBar.y = s.y - 36;

      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, s.x, s.y);
      if (d < 300) {
        // Погоня за игроком
        this.physics.moveToObject(s, this.player, 80);
        // Стрельба по игроку
        if (d < 250 && time % 1000 < 20 && Math.random() > 0.5) {
          const eb = this.add.rectangle(s.x, s.y, 6, 6, 0xff0000);
          this.physics.add.existing(eb);
          const angle = Phaser.Math.Angle.Between(s.x, s.y, this.player.x, this.player.y);
          eb.body.setVelocity(Math.cos(angle)*300, Math.sin(angle)*300);
          this.enemyBullets.add(eb);
          this.time.delayedCall(2000, () => { if(eb.active) eb.destroy(); });
        }
      } else {
        s.body.setVelocity(0);
      }

      if (d < 40 && time - this.lastHitBySoldier > 800) {
        this.lastHitBySoldier = time;
        this.damagePlayer(10);
      }
    });

    // Ведение пленника
    this.npcs.getChildren().forEach(n => {
      if (n.npcType === 'captured') {
        const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, n.x, n.y);
        if (dist > 40) this.physics.moveToObject(n, this.player, 150);
        else n.body.setVelocity(0);
      }
    });

    if (this.inDialog) { this.player.body.setVelocity(0); return; }
    
    const speed = 200, b = this.player.body;
    b.setVelocity(0);
    if (this.cursors.left.isDown || this.wasd.A.isDown)  b.setVelocityX(-speed);
    if (this.cursors.right.isDown || this.wasd.D.isDown) b.setVelocityX(speed);
    if (this.cursors.up.isDown || this.wasd.W.isDown)    b.setVelocityY(-speed);
    if (this.cursors.down.isDown || this.wasd.S.isDown)  b.setVelocityY(speed);
    b.velocity.normalize().scale(speed);
  }

  damagePlayer(amount) {
    this.hp -= amount;
    if (this.hp <= 0) {
      this.hp = this.maxHp; this.money = Math.max(0, this.money - 20);
      this.player.x = 980; this.player.y = 680;
      this.cameras.main.shake(200, 0.01);
    }
    this.updateUI();
  }
}

const config = {
  type: Phaser.AUTO, width: 960, height: 540, backgroundColor: '#3a5a40',
  physics: { default: 'arcade', arcade: { debug: false } },
  scene: [ WorldScene ] 
};
new Phaser.Game(config);
</script>
</body>
</html>
